name: Collecte carnet

# PHASE 1 — actif par defaut.
# Enregistre le carnet BTC/USD en continu dans data/. A laisser tourner
# 1 a 2 semaines avant de calibrer la strategie (voir README).
# Une fois le bot live active, DESACTIVER ce workflow (onglet Actions >
# Collecte carnet > ... > Disable workflow) : les deux ecrivent dans data/.

on:
  schedule:
    # Toutes les 2 heures, alors que la session dure 4 h 55 : combine a
    # cancel-in-progress, une panne est donc rattrapee en 2 heures au pire
    # au lieu de 5. La relance ne coute rien, les donnees sont deja commitees.
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orderbook-data         # jamais deux ecrivains sur data/ en parallele
  # true, et non false : une session bloquee retenait le groupe indefiniment
  # et TOUT s'empilait derriere elle (constate le 2026-08-08 : 4 h 40 sans
  # collecte, run #7 en attente d'un run #6 fige). Avec true, la session
  # suivante reprend la main. Le cout est nul : les donnees sont commitees
  # toutes les 10 minutes, une session interrompue ne perd que son tampon.
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330        # coupe-circuit sous la limite GitHub de 6 h
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Git config
        run: |
          git config user.name  "orderbook-collector"
          git config user.email "actions@github.com"

      - name: Collecte (~5 h)
        env:
          GIT_PUSH: "1"
          MAX_RUNTIME: "17700"  # 4 h 55 : la session suivante prend le relais
        run: python collector.py

      - name: Commit de securite
        if: always()
        run: |
          git add data 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Sauvegarde fin de session"
          git pull --rebase || true
          git push || true
