<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot carnet d'ordres — BTC/USD</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b24; --line:#1c2531; --txt:#e6edf3;
    --dim:#8b949e; --accent:#4cc3d9; --up:#3fb950; --down:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 ui-sans-serif,system-ui,"Segoe UI",sans-serif;padding:20px}
  h1{font-size:18px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
        gap:12px;margin-bottom:18px}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:8px;padding:12px 14px}
  .card .k{color:var(--dim);font-size:11px;text-transform:uppercase;
           letter-spacing:.5px;margin-bottom:4px}
  .card .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .dim{color:var(--dim)}
  .panel{background:var(--panel);border:1px solid var(--line);
         border-radius:8px;padding:14px;margin-bottom:18px}
  .panel h2{font-size:13px;margin:0 0 10px;color:var(--dim);
            text-transform:uppercase;letter-spacing:.5px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px;
        font-variant-numeric:tabular-nums;white-space:nowrap}
  th{text-align:right;color:var(--dim);font-weight:600;padding:6px 8px;
     border-bottom:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:none}
  .banner{background:#2d1a1a;border:1px solid #5c2b2b;color:#ffb4b4;
          border-radius:8px;padding:10px 14px;margin-bottom:18px;font-size:13px}
  .hidden{display:none}
  svg{width:100%;height:180px;display:block}
</style>
</head>
<body>

<h1>Bot carnet d'ordres <span class="dim">· OBI + murs de liquidité</span></h1>
<div class="sub" id="sub">BTC/USD · Kraken · paper trading</div>

<div id="banner" class="banner hidden"></div>

<div class="grid">
  <div class="card"><div class="k">Capital</div><div class="v" id="capital">—</div></div>
  <div class="card"><div class="k">PnL total</div><div class="v" id="pnl">—</div></div>
  <div class="card"><div class="k">Trades</div><div class="v" id="ntrades">—</div></div>
  <div class="card"><div class="k">Winrate</div><div class="v" id="winrate">—</div></div>
  <div class="card"><div class="k">Frais payés</div><div class="v" id="fees">—</div></div>
  <div class="card"><div class="k">Position</div><div class="v" id="position">—</div></div>
</div>

<div class="panel">
  <h2>Courbe de capital</h2>
  <svg id="equity" viewBox="0 0 800 180" preserveAspectRatio="none"></svg>
</div>

<div class="panel">
  <h2>Derniers trades</h2>
  <div class="scroll"><table>
    <thead><tr>
      <th>Ouvert</th><th>Sens</th><th>Entrée</th><th>SL</th><th>TP</th>
      <th>Sortie</th><th>Résultat</th><th>Durée</th><th>Frais</th>
      <th>PnL</th><th>R</th><th>Capital</th>
    </tr></thead>
    <tbody id="trades"><tr><td colspan="12" class="dim">Chargement…</td></tr></tbody>
  </table></div>
</div>

<script>
/* ---- À RENSEIGNER une fois le repo créé ---- */
const CFG = { user:"ohnonpaslui", repo:"orderbook-bot", branch:"HEAD", bot:"obi_walls" };

const RAW = p => `https://raw.githubusercontent.com/${CFG.user}/${CFG.repo}/${CFG.branch}/${p}?t=${Date.now()}`;
const $   = id => document.getElementById(id);
const usd = n => (n>=0?"+":"−") + Math.abs(n).toFixed(2) + "$";
const cls = n => n>0 ? "up" : n<0 ? "down" : "dim";

function banner(msg){ const b=$("banner"); b.textContent=msg; b.classList.remove("hidden"); }

/* Parseur CSV minimal : les fichiers du bot ne contiennent ni virgule
   échappée ni guillemet, un split suffit et évite une dépendance. */
function parseCSV(text){
  const lines = text.trim().split("\n");
  const head  = lines[0].split(",");
  return lines.slice(1).map(l => {
    const cells = l.split(",");
    return Object.fromEntries(head.map((h,i) => [h, cells[i]]));
  });
}

function drawEquity(points){
  const svg = $("equity");
  if (points.length < 2){
    svg.innerHTML = `<text x="400" y="95" fill="#8b949e" font-size="13"
                     text-anchor="middle">Pas encore assez de trades</text>`;
    return;
  }
  const W=800, H=180, pad=8;
  const min=Math.min(...points), max=Math.max(...points);
  const span = (max-min) || 1;
  const x = i => pad + i*(W-2*pad)/(points.length-1);
  const y = v => H-pad - (v-min)/span*(H-2*pad);

  const line = points.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const area = `${line}L${x(points.length-1).toFixed(1)},${H-pad}L${x(0)},${H-pad}Z`;
  const up   = points[points.length-1] >= points[0];
  const col  = up ? "#3fb950" : "#f85149";

  svg.innerHTML =
    `<path d="${area}" fill="${col}" opacity="0.10"/>` +
    `<path d="${line}" fill="none" stroke="${col}" stroke-width="2"
           vector-effect="non-scaling-stroke"/>`;
}

async function load(){
  let state = null, trades = [];

  try {
    const r = await fetch(RAW(`state/${CFG.bot}.json`));
    if (r.ok) state = await r.json();
  } catch(e){ /* traité plus bas */ }

  try {
    const r = await fetch(RAW(`trades/${CFG.bot}.csv`));
    if (r.ok) trades = parseCSV(await r.text());
  } catch(e){ /* pas encore de trades : normal au démarrage */ }

  if (!state){
    banner(`Impossible de lire state/${CFG.bot}.json — vérifie que le repo `
         + `${CFG.repo} est PUBLIC et que le bot a déjà tourné une fois.`);
    return;
  }

  const start   = 1000;
  const capital = Number(state.capital);
  const pnl     = capital - start;
  const w = Number(state.wins||0), l = Number(state.losses||0);

  $("capital").textContent  = capital.toFixed(2) + "$";
  $("pnl").textContent      = usd(pnl);
  $("pnl").className        = "v " + cls(pnl);
  $("ntrades").textContent  = w + l;
  $("winrate").textContent  = (w+l) ? (w/(w+l)*100).toFixed(1) + "%" : "—";
  $("fees").textContent     = "−" + Number(state.fees_paid||0).toFixed(2) + "$";
  $("fees").className       = "v dim";

  const p = state.position;
  $("position").textContent = p ? `${p.side.toUpperCase()} @ ${Number(p.entry).toFixed(0)}` : "aucune";
  $("position").className   = "v " + (p ? (p.side==="buy"?"up":"down") : "dim");

  if (state.updated) $("sub").textContent =
    `BTC/USD · Kraken · paper trading · mis à jour ${state.updated} UTC`;

  drawEquity([start, ...trades.map(t => Number(t.capital))]);

  const tb = $("trades");
  if (!trades.length){
    tb.innerHTML = `<tr><td colspan="12" class="dim">Aucun trade clôturé pour l'instant.</td></tr>`;
    return;
  }
  tb.innerHTML = trades.slice(-25).reverse().map(t => {
    const v = Number(t.pnl);
    const dur = Number(t.hold_s);
    const durTxt = dur >= 3600 ? (dur/3600).toFixed(1)+"h"
                 : dur >= 60   ? Math.round(dur/60)+"m" : dur+"s";
    return `<tr>
      <td class="dim">${t.opened}</td>
      <td class="${t.side==="buy"?"up":"down"}">${t.side.toUpperCase()}</td>
      <td>${Number(t.entry).toFixed(2)}</td>
      <td class="dim">${Number(t.sl).toFixed(2)}</td>
      <td class="dim">${Number(t.tp).toFixed(2)}</td>
      <td>${Number(t.exit).toFixed(2)}</td>
      <td>${t.result}</td>
      <td class="dim">${durTxt}</td>
      <td class="dim">−${Number(t.fees).toFixed(2)}$</td>
      <td class="${cls(v)}">${usd(v)}</td>
      <td class="${cls(v)}">${Number(t.r).toFixed(2)}</td>
      <td>${Number(t.capital).toFixed(2)}$</td>
    </tr>`;
  }).join("");
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
